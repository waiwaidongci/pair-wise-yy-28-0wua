<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.day{border:1px solid #ccc;border-radius:8px;padding:8px;margin:6px 0}.err{color:#b00020}.ok{color:#1a7f37}li{margin:3px 0}</style><h1>影视拍摄连续性管理</h1><section><h2>连续性报告</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button><pre id="state"></pre></section><section><h2>整片预检与拍摄日看板</h2><button onclick="precheck()">运行整片预检</button><button onclick="loadBoard()">刷新看板</button><div id="board"></div></section><section><h2>拍摄日维护（制片/场记）</h2><div class="grid"><input id="dlabel" placeholder="拍摄日名称"><input id="ddate" placeholder="拍摄日期"><input id="day" type="number" placeholder="拍摄日 ID"><input id="dscene" type="number" placeholder="场次 ID"><input id="dorder" type="number" placeholder="拍摄顺位"><input id="dnote" placeholder="放行备注"></div><button onclick="addDay()">创建拍摄日</button><button onclick="schedule()">场次排期/调序</button><button onclick="unschedule()">取消排期</button><button onclick="release(true)">放行拍摄日</button><button onclick="release(false)">撤销放行</button><pre id="daymsg"></pre></section><section><h2>状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><pre id="result"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}function report(){get('/api/productions/'+production.value+'/continuity','#state')}function renderBoard(d){const el=document.querySelector('#board');if(d.ok===false||d.error){el.innerHTML='<p class="err">'+esc(d.error||'加载失败')+'</p>';return}let h='<h3>待处理问题（'+d.pending_issues.length+'）</h3>';h+=d.pending_issues.length?'<ul>'+d.pending_issues.map(i=>'<li><b>'+(i.scope==='cross'?'跨场 ':'场内 ')+esc(i.from_scene_number)+(i.scope==='cross'?' → '+esc(i.to_scene_number):'')+'</b> '+esc(i.element_name)+'：'+esc(i.detail)+' <i>[冲突 #'+i.id+' '+esc(i.kind)+']</i></li>').join('')+'</ul>':'<p class="ok">无未处理问题</p>';if(d.exempted_issues.length)h+='<details><summary>已豁免 '+d.exempted_issues.length+' 项</summary><ul>'+d.exempted_issues.map(i=>'<li>'+esc(i.element_name)+'：'+esc(i.detail)+'</li>').join('')+'</ul></details>';h+='<h3>场次</h3><ul>'+d.scenes.map(s=>'<li>#'+s.id+' '+esc(s.scene_number+' '+s.title)+'（叙事 '+s.narrative_order+'）'+(s.open_issues?' <span class="err">'+s.open_issues+' 个未处理</span>':' <span class="ok">无未处理</span>')+' '+(s.scheduled_in.length?'已排：'+s.scheduled_in.map(x=>esc(x.label)+' 第'+x.queue_order+'顺位').join('，'):'未排期')+'</li>').join('')+'</ul>';h+='<h3>拍摄日</h3>';h+=d.shoot_days.length?d.shoot_days.map(day=>{let s='<div class="day"><b>#'+day.id+' '+esc(day.label)+'</b> '+esc(day.shoot_date)+' 状态：'+(day.status==='released'?'✅ 已放行':'📝 草稿')+(day.needs_recheck?' <span class="err">（出现新问题，需处理并重检）</span>':'');s+='<br>场次：'+(day.scenes.length?day.scenes.map(x=>esc(x.queue_order+'. '+x.scene_number+' '+x.title)).join('，'):'未排期');if(day.blockers.length)s+='<br><span class="err">阻断原因：'+day.blockers.map(b=>esc(b.detail)).join('；')+'</span>';else if(day.scenes.length)s+='<br><span class="ok">无阻断，可放行</span>';return s+'</div>'}).join(''):'<p>尚未创建拍摄日</p>';el.innerHTML=h}async function precheck(){renderBoard(await(await fetch('/api/productions/'+production.value+'/precheck',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json())}async function loadBoard(){renderBoard(await(await fetch('/api/productions/'+production.value+'/board')).json())}function addDay(){post('/api/productions/'+production.value+'/shoot-days',{label:dlabel.value,shoot_date:ddate.value,user_id:+user.value},'#daymsg')}function schedule(){post('/api/shoot-days/'+day.value+'/scenes',{scene_id:+dscene.value,queue_order:+dorder.value,user_id:+user.value},'#daymsg')}function unschedule(){post('/api/shoot-days/'+day.value+'/unschedule',{scene_id:+dscene.value,user_id:+user.value},'#daymsg')}function release(on){post('/api/shoot-days/'+day.value+'/release',{release:on,user_id:+user.value,note:dnote.value},'#daymsg')}function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value})}function check(){post('/api/scenes/'+scene.value+'/check',{})}function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value})}function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}report()</script></html>
